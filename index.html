<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7bc74"><title>鼠除大作戰｜魔法星星槌</title>
<style>
:root{font-family:'Trebuchet MS','Noto Sans TC','Microsoft JhengHei',sans-serif;color:#56321f;background:#fce5c6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#fff7d1,#f5c5a0 65%,#ddaa82);display:flex;justify-content:center;align-items:center;padding:12px}button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}button:focus-visible{outline:3px solid white;outline-offset:3px}.shell{position:relative;width:min(100%,1000px);aspect-ratio:960/660;min-height:400px;max-height:calc(100dvh - 24px);overflow:hidden;border-radius:25px;border:6px solid #fff4cc;box-shadow:0 20px 65px #84512b66, inset 0 0 0 3px #c9804b;background:#83ce96;isolation:isolate}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:13px;left:16px;right:16px;display:none;align-items:center;justify-content:space-between;gap:7px;pointer-events:none}.hud.show{display:flex}.pill{background:linear-gradient(#85502d,#58351f);border:3px solid #ffc96c;box-shadow:0 4px 0 #543216,0 6px 11px #4327125e;border-radius:16px;color:#fff5ce;padding:5px 13px;text-align:center;font-size:clamp(11px,1.65vw,17px);font-weight:900;white-space:nowrap;text-shadow:1px 2px 1px #362011}.pill strong{font-size:1.24em;color:#ffe561}.hud button{pointer-events:auto;min-width:49px}.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:17px;background:linear-gradient(#fff0cf44,#4c2c3366);overflow-y:auto}.overlay.show{display:flex}.panel{width:min(670px,98%);max-height:100%;overflow-y:auto;text-align:center;background:linear-gradient(150deg,#fff9df,#ffe1ad);border:5px solid #fff9d5;border-radius:28px;box-shadow:0 12px 0 #b57347,0 19px 36px #502d2380;padding:clamp(13px,2.5vw,25px)}h1{margin:0;font-size:clamp(30px,6vw,58px);color:#ef703e;-webkit-text-stroke:1.5px #923f2b;text-shadow:2px 4px #ffe87d,4px 6px #b35032;line-height:1.2}h2{font-size:clamp(22px,3.6vw,35px);margin:0 0 8px;color:#984c2e}p{margin:8px 0 15px;line-height:1.5}.sub{font-weight:800;color:#a66d46}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:11px;margin:15px 0}.btn{color:white;font-weight:900;font-size:clamp(15px,2vw,20px);padding:12px 21px;border-radius:17px;background:linear-gradient(#ffb23f,#f07631);border:3px solid #fff2c2;box-shadow:0 5px 0 #b85e34,0 7px 9px #6b422b55;text-shadow:1px 2px #a04f2c}.btn.secondary{background:linear-gradient(#94d5ec,#358bbf);box-shadow:0 5px 0 #33728c}.btn.green{background:linear-gradient(#b1d875,#55a95d);box-shadow:0 5px 0 #467e43}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b85e34}.btn[disabled]{opacity:.5;filter:grayscale(.7);cursor:not-allowed}.difficulty{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.difficulty button{background:#fff6de;border:2px solid #dab079;padding:9px 16px;border-radius:12px;color:#8c603d;font-weight:900}.difficulty button.selected{background:#f9a848;border-color:#ae5836;color:white}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px;margin:12px auto}.map button{border:2px solid #f0c182;background:#fff8d8;border-radius:14px;padding:8px 2px;min-height:52px;font-weight:900;color:#93522d}.map button.current{background:#ffe18c;box-shadow:inset 0 0 0 2px #e69e3a}.map button.locked{filter:grayscale(.8);opacity:.45}.map small{display:block;font-size:10px}.note{font-size:13px;color:#9b714e}.statline{font-size:19px;font-weight:900;color:#8e502e;margin:12px 0}.stars{font-size:45px;color:#e7a82a;text-shadow:0 2px #ad6228}.toast{position:absolute;top:83px;left:50%;transform:translateX(-50%);background:#fff7dbee;border:3px solid #e9aa63;border-radius:14px;padding:7px 14px;color:#87472a;font-weight:900;text-align:center;display:none;pointer-events:none;z-index:3}.toast.show{display:block}.footer{position:fixed;bottom:0;color:#805537;font-size:11px;opacity:.75;pointer-events:none}@media(max-width:680px){body{padding:0;background:#eec49f}.shell{width:100vw;height:100dvh;max-height:none;min-height:0;border-width:0;border-radius:0;aspect-ratio:auto}.hud{left:5px;right:5px;top:7px;gap:3px}.pill{font-size:11px;padding:6px 5px;border-width:2px;border-radius:11px}.hud button{min-width:37px}.overlay{padding:7px}.panel{padding:14px 8px;border-radius:20px}.map{gap:4px}.map button{min-height:42px}.footer{display:none}}
</style>
</head>
<body>
<main class="shell" id="shell" aria-label="鼠除大作戰遊戲"><canvas id="game" width="960" height="660" aria-label="打地鼠遊戲畫面"></canvas>
<div class="hud" id="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">⏰ <span id="timer">60</span>s</div><div class="pill">🔥 <span id="combo">0</span> Combo</div><div class="pill">🎯 <span id="objective">0/0</span></div><button class="pill" id="pause" aria-label="暫停">Ⅱ</button></div>
<div class="toast" id="toast"></div>
<section class="overlay show" id="home"><div class="panel"><div style="font-size:48px">🌟🐹✨</div><h1>鼠除大作戰</h1><p class="sub">魔法星星槌 · 六大世界 · 30個關卡</p><p>敲地鼠拿分數！黃金地鼠 <b>+5</b>、炸彈地鼠 <b>-3</b>、愛心地鼠 <b>+3秒</b><br>連續敲中可獲得 Combo 加成，20 連擊進入 FEVER！</p><div class="buttons"><button class="btn" id="chooseLevel">🗺️ 選擇關卡</button><button class="btn secondary" id="endless">♾️ 無盡模式</button></div><p class="note">手機觸控與滑鼠都可以遊玩 · 敲擊有音效 · 支援裝置才會震動</p><div class="buttons"><button class="btn green" id="audioBtn">🔊 音效開啟</button></div></div></section>
<section class="overlay" id="levels"><div class="panel"><h2>🗺️ 關卡選擇</h2><p class="sub" id="worldLabel">每5關進入新的世界！</p><div class="difficulty" id="diffBtns"><button data-diff="easy" class="selected">🌼 簡單</button><button data-diff="normal">⚡ 普通</button><button data-diff="hard">🔥 困難</button></div><div class="map" id="levelMap"></div><p class="note">完成關卡可解鎖下一關。進度保存在此瀏覽器。</p><div class="buttons"><button class="btn secondary" data-back>↩ 回首頁</button></div></div></section>
<section class="overlay" id="result"><div class="panel"><h2 id="resultTitle">挑戰結果</h2><div class="stars" id="resultStars">⭐⭐⭐</div><p class="statline" id="resultStats"></p><p id="resultDetail"></p><div class="buttons"><button class="btn green" id="nextLevel">下一關 ➜</button><button class="btn" id="retry">🔄 再玩一次</button><button class="btn secondary" id="resultLevels">🗺️ 關卡選擇</button></div></div></section>
<section class="overlay" id="paused"><div class="panel"><h2>⏸ 遊戲暫停</h2><p>魔法星星槌準備好了嗎？</p><div class="buttons"><button class="btn green" id="resume">▶ 繼續遊戲</button><button class="btn secondary" id="quit">🏠 返回首頁</button></div></div></section>
</main><div class="footer">鼠除大作戰 · 原創 Canvas 遊戲原型 · 可直接部署 GitHub Pages</div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id); const W=960,H=660,TAU=Math.PI*2;
const themes=[
 {name:'童話花園',sky:['#9be8ff','#fff0b4'],grass:'#85c963',hill:'#bce18c',tree:'#62b967',accent:'#ffc85c'},
 {name:'漫畫庭院',sky:['#62cafa','#fff2a2'],grass:'#7dcc65',hill:'#a5d67f',tree:'#46a84c',accent:'#fbd24c'},
 {name:'奇幻蘑菇森林',sky:['#6b71bd','#e6afde'],grass:'#6eb6a1',hill:'#709e92',tree:'#517a8d',accent:'#aaf8ff'},
 {name:'糖果王國',sky:['#fca6ce','#ffdaaa'],grass:'#a8d98c',hill:'#e7c0cf',tree:'#eb97b5',accent:'#ffe18c'},
 {name:'星光夢境森林',sky:['#24295f','#8468aa'],grass:'#507b94',hill:'#62779f',tree:'#456b83',accent:'#f5dc86'},
 {name:'黃金城堡',sky:['#ffbf81','#fff0ba'],grass:'#91bc72',hill:'#dac58e',tree:'#76aa65',accent:'#ffe071'}
];
let mode='level',level=1,difficulty='easy',phase='home',soundOn=true,score=0,combo=0,bestCombo=0,timeLeft=60,elapsed=0,spawnClock=0,last=0,active=[],particles=[],texts=[],hammer=null,goal=20,hits=0,golds=0,bossHits=0,bossGoal=0,misses=0,feverTime=0,shake=0,starsEarned=0;
let progress=load('mole_progress',{unlocked:1,stars:{},best:0});
function load(k,fallback){try{return JSON.parse(localStorage.getItem(k))||fallback}catch{return fallback}}
function save(){try{localStorage.setItem('mole_progress',JSON.stringify(progress))}catch{}}
const holes=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)holes.push({x:240+c*240,y:272+r*151,row:r,col:c});
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const diffData={easy:{spawn:[.65,.95],stay:2.5,max:2,bomb:.05},normal:{spawn:[.48,.75],stay:1.8,max:3,bomb:.12},hard:{spawn:[.32,.54],stay:1.2,max:4,bomb:.2}};
const TYPES={normal:{points:1,color:'#b97848'},fast:{points:2,color:'#e69b52'},gold:{points:5,color:'#f9ce43'},heart:{points:0,color:'#efa7b4'},bomb:{points:-3,color:'#474554'},boss:{points:0,color:'#e6b966'}};
function rounded(x,y,w,h,r,fill,stroke=null,sw=2){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=sw;ctx.strokeStyle=stroke;ctx.stroke()}}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);ctx.fillStyle=color;ctx.fill()}
function star(x,y,r,color,angle=0){ctx.beginPath();for(let i=0;i<10;i++){let a=angle-Math.PI/2+i*Math.PI/5,rr=i%2?r*.48:r;let xx=x+rr*Math.cos(a),yy=y+rr*Math.sin(a);if(!i)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function line(x1,y1,x2,y2,color,w){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke()}
function label(s,x,y,size=24,color='white',outline='#86512b'){ctx.font=`1000 ${size}px 'Trebuchet MS','Microsoft JhengHei',sans-serif`;ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size/5);ctx.strokeStyle=outline;ctx.strokeText(s,x,y);ctx.fillStyle=color;ctx.fillText(s,x,y)}
function setScreen(id){['home','levels','result','paused'].forEach(v=>$(v).classList.toggle('show',v===id));$('hud').classList.toggle('show',!id||id==='paused');phase=id||'playing'}
function showToast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>$('toast').classList.remove('show'),1450)}
function setupMap(){const map=$('levelMap');map.innerHTML='';for(let i=1;i<=30;i++){let b=document.createElement('button'),locked=i>progress.unlocked,best=progress.stars[i]||0;b.innerHTML=(locked?'🔒':i)+`<small>${locked?'未解鎖':'★'.repeat(best)+'☆'.repeat(3-best)}</small>`;b.className=(locked?'locked ':'')+(i===progress.unlocked?'current':'');b.disabled=locked;b.onclick=()=>start(i,'level');map.append(b)}$('worldLabel').textContent=`目前解鎖第 ${progress.unlocked} 關｜每5關更換背景`}
function openLevels(){setupMap();setScreen('levels')}
function levelMission(){if(mode==='endless')return {type:'endless',target:0,desc:'無盡挑戰'};if(level%10===0)return {type:'boss',target:level===30?9:6,desc:'擊敗國王地鼠'};if(level%5===0)return {type:'combo',target:Math.min(8+Math.floor(level/2),19),desc:'達成最高連擊'};if(level%5===3)return {type:'gold',target:2+Math.floor(level/10),desc:'擊中黃金地鼠'};return {type:'score',target:14+level*3,desc:'達成目標分數'}}
let mission={type:'score',target:20};
function start(n,m='level'){mode=m;level=n;mission=levelMission();goal=mission.target;score=0;combo=0;bestCombo=0;timeLeft=60;elapsed=0;spawnClock=.35;active=[];particles=[];texts=[];hammer=null;hits=0;golds=0;bossHits=0;bossGoal=mission.type==='boss'?mission.target:0;misses=0;feverTime=0;shake=0;last=0;setScreen(null);updateHUD();showToast(mode==='endless'?'無盡挑戰開始！':`第 ${level} 關：${themes[Math.floor((level-1)/5)].name}｜${mission.desc}`);beep('start')}
function missionValue(){return mission.type==='boss'?bossHits:mission.type==='combo'?bestCombo:mission.type==='gold'?golds:score}
function updateHUD(){$('score').textContent=score;$('timer').textContent=Math.ceil(timeLeft);$('combo').textContent=combo;$('objective').textContent=mode==='endless'?'最高分':`${missionValue()}/${goal}`}
function chooseType(){if(mission.type==='boss'&&Math.random()<.38)return'boss';let bomb=diffData[difficulty].bomb+Math.floor((level-1)/5)*.008,v=Math.random();if(v<bomb)return 'bomb';if(v<bomb+.11+(mission.type==='gold'?.13:0))return 'gold';if(v<bomb+.19)return 'heart';if(v<bomb+.36+level*.002)return 'fast';return 'normal'}
function spawn(){let cfg=diffData[difficulty];if(active.length>=cfg.max)return;let available=holes.map((_,i)=>i).filter(i=>!active.some(m=>m.i===i));if(!available.length)return;let i=available[Math.floor(Math.random()*available.length)],type=chooseType();let stay=cfg.stay*({normal:1,fast:.70,gold:.6,heart:.75,bomb:.88,boss:1.15}[type]);stay=Math.max(.43,stay);active.push({i,type,age:0,stay,stage:'appear',out:.01,hit:false,seed:Math.random()*100});if(type==='gold')beep('goldspawn')}
function particleBurst(x,y,type='star',num=12){let colors=type==='bomb'?['#55505f','#ff6a50','#f9ca60']:type==='heart'?['#fba6d3','#ff7398','#fff5bb']:['#ffe26c','#ffffff','#ff9b51','#ffd15a'];for(let j=0;j<num;j++){let a=rnd(0,TAU),v=rnd(65,225);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-65,life:rnd(.35,.85),max:.85,color:colors[j%colors.length],size:rnd(3,10),shape:Math.random()<.55?'star':'dot'})}}
function floating(s,x,y,color='#fff6ac',size=32){texts.push({s,x,y,life:1.1,size,color})}
function haptic(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch{}}
let audio=null;function beep(type){if(!soundOn)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;let tones=type==='hit'?[[510,.09,'sine'],[720,.09,'triangle']]:type==='bomb'?[[135,.19,'sawtooth'],[80,.24,'triangle']]:type==='gold'?[[750,.12,'sine'],[1050,.19,'sine']]:type==='combo'?[[620,.09,'triangle'],[830,.09,'triangle'],[1040,.15,'sine']]:type==='miss'?[[160,.08,'sine']]:type==='goldspawn'?[[880,.09,'sine']]:[[440,.10,'sine'],[660,.14,'sine']];tones.forEach(([hz,d,wave],i)=>{let o=audio.createOscillator(),g=audio.createGain(),st=now+i*.073;o.type=wave;o.frequency.setValueAtTime(hz,st);g.gain.setValueAtTime(.001,st);g.gain.exponentialRampToValueAtTime(.085,st+.012);g.gain.exponentialRampToValueAtTime(.001,st+d);o.connect(g).connect(audio.destination);o.start(st);o.stop(st+d+.01)})}catch{}}
function hitAt(x,y){if(phase!=='playing')return;hammer={x,y,t:0};let target=null;for(let k=active.length-1;k>=0;k--){let m=active[k],p=holes[m.i];if(m.stage==='hit'||m.out<.4)continue;let dx=(x-p.x)/83,dy=(y-(p.y-47*m.out))/100;if(dx*dx+dy*dy<1){target=m;break}}
if(!target){combo=0;misses++;floating('MISS',x,y,'#bcdfff',26);beep('miss');haptic(8);updateHUD();return}
target.stage='hit';target.hit=true;target.age=0;let {type}=target,p=holes[target.i];shake=type==='bomb'?12:5;particleBurst(p.x,p.y-60,type,type==='bomb'?19:14);
if(type==='bomb'){score=Math.max(0,score-3);combo=0;floating('-3 💥',p.x,p.y-86,'#ff7979');beep('bomb');haptic([60,40,100])}
else {hits++;combo++;bestCombo=Math.max(bestCombo,combo);if(type==='heart'){timeLeft+=3;floating('+3 秒 💗',p.x,p.y-90,'#ffb5d9');beep('gold')}else if(type==='boss'){bossHits++;score+=2;floating('BONK! 👑',p.x,p.y-95,'#ffdf7b');beep('hit')}else{let mul=combo>=20?3:combo>=10?2:combo>=5?1.5:1;let add=Math.ceil(TYPES[type].points*mul);score+=add;if(type==='gold'){golds++;floating(`+${add} ⭐`,p.x,p.y-90,'#ffe06a');beep('gold')}else{floating(Math.random()<.5?'啪！':'BONK!',p.x,p.y-87,'#fff0a3');floating(`+${add}`,p.x+38,p.y-50,'#ffdb75',23);beep('hit')}}if(combo===5||combo===10||combo===20){floating(combo===20?'FEVER!':`${combo} COMBO!`,480,160,'#ffec6b',44);particleBurst(480,200,'star',32);beep('combo');if(combo===20)feverTime=7}haptic(type==='gold'?35:18)}updateHUD()}
function finish(){if(phase!=='playing')return;const achieved=mission.type==='endless'||missionValue()>=goal;let ratio=mission.type==='endless'?1:missionValue()/Math.max(1,goal);starsEarned=achieved?ratio>=1.7?3:ratio>=1.25?2:1:0;if(mode==='level'&&achieved){progress.unlocked=Math.max(progress.unlocked,Math.min(30,level+1));progress.stars[level]=Math.max(progress.stars[level]||0,starsEarned)}progress.best=Math.max(progress.best,score);save();$('resultTitle').textContent=mode==='endless'?'♾️ 無盡結束':achieved?'🎉 挑戰成功！':'再接再厲！';$('resultStars').textContent=mode==='endless'?'🏆':'⭐'.repeat(starsEarned)+'☆'.repeat(3-starsEarned);$('resultStats').textContent=`分數 ${score} ｜ 最大連擊 ${bestCombo} ｜ 擊中 ${hits}`;$('resultDetail').textContent=mode==='endless'?`個人最高分：${progress.best}`:`第 ${level} 關｜${mission.desc}：${missionValue()}/${goal}`;$('nextLevel').style.display=mode==='level'&&achieved&&level<30?'inline-block':'none';setScreen('result');beep(achieved?'combo':'miss')}
function update(dt){if(phase!=='playing')return;elapsed+=dt;timeLeft-=dt;feverTime=Math.max(0,feverTime-dt);shake=Math.max(0,shake-40*dt);let c=diffData[difficulty];spawnClock-=dt;if(spawnClock<=0){spawn();spawnClock=rnd(...c.spawn)*Math.max(.6,1-level*.008)}
for(let m of active){m.age+=dt;if(m.stage==='appear'){m.out=Math.min(1,m.age/.23);if(m.out>=1){m.stage='stay';m.age=0}}else if(m.stage==='stay'){m.out=1;if(m.age>m.stay){m.stage='hide';m.age=0;if(m.type!=='bomb'&&m.type!=='heart')combo=0}}else if(m.stage==='hide')m.out=Math.max(0,1-m.age/.24);else if(m.stage==='hit')m.out=Math.max(0,1-m.age/.45)}active=active.filter(m=>!(m.stage==='hide'&&m.age>.24||m.stage==='hit'&&m.age>.47));
for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(let t of texts){t.y-=60*dt;t.life-=dt}texts=texts.filter(t=>t.life>0);if(hammer){hammer.t+=dt;if(hammer.t>.25)hammer=null}updateHUD();if(timeLeft<=0){timeLeft=0;finish()}}
function bg(){let idx=Math.floor((level-1)/5)%6,T=themes[idx],stage=((level-1)%5);let grad=ctx.createLinearGradient(0,0,0,660);grad.addColorStop(0,T.sky[0]);grad.addColorStop(.72,T.sky[1]);grad.addColorStop(1,T.grass);ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);let dusk=stage===3,night=stage===4||idx===4;if(dusk){ctx.fillStyle='#ffae6745';ctx.fillRect(0,0,W,H)}if(night){ctx.fillStyle='#26316c60';ctx.fillRect(0,0,W,H)}
for(let j=0;j<5;j++){let xx=110+j*190,yy=120+j%2*21;ellipse(xx,yy,70,24,'#ffffff76');ellipse(xx+35,yy-9,45,27,'#ffffff6f')}
if(night){for(let j=0;j<42;j++)star((j*199+41)%W,(j*73+41)%255,2+(j%3), '#fff5b2a8',elapsed*.05)}else{ellipse(800,84,52,52,'#fff1a5b0');ellipse(800,84,39,39,'#fff6c8')}
ctx.fillStyle=T.hill;ctx.beginPath();ctx.moveTo(0,288);ctx.quadraticCurveTo(230,165,470,285);ctx.quadraticCurveTo(700,175,960,265);ctx.lineTo(960,660);ctx.lineTo(0,660);ctx.fill();

function drawHole(p){ctx.save();ctx.translate(p.x,p.y);ellipse(0,18,98,35,'#6b432986');ellipse(0,8,90,32,'#91623b');ellipse(0,8,75,24,'#382719');for(let j=0;j<15;j++){let a=j*TAU/15,r=75;ellipse(Math.cos(a)*r,11+Math.sin(a)*20,15+rnd(0,0),10,j%3===0?'#bd8b51':'#9b693d')}ctx.restore()}
function frontHole(p){ctx.save();ctx.translate(p.x,p.y);ellipse(0,20,84,19,'#8e5c37');for(let j=0;j<12;j++){let a=.15+j*Math.PI/11,xx=Math.cos(a)*78,yy=14+Math.sin(a)*15;ellipse(xx,yy,14,10,j%3?'#b9864d':'#d09d5e')}ctx.restore()}
function mole(m){let p=holes[m.i],out=m.out;if(out<=0)return;let age=m.age,kick=m.stage==='hit'?Math.sin(Math.min(1,age/.25)*Math.PI)*.26:0;ctx.save();ctx.beginPath();ctx.rect(p.x-115,p.y-205,230,224);ctx.clip();ctx.translate(p.x,p.y+11-out*94+kick*30);ctx.rotate(m.stage==='hit'?Math.sin(age*18)*.2:0);let s=m.type==='boss'?1.12:1;ctx.scale(s*(1+kick*.1),s*(1-kick*.23));let type=m.type,col=TYPES[type].color;ellipse(0,-6,72,75,col);ellipse(0,16,51,38,type==='bomb'?'#747080':type==='gold'?'#ffe69c':'#ffe4b7');ellipse(-49,13,21,19,col);ellipse(49,13,21,19,col);ellipse(-57,-53,18,19,col);ellipse(57,-53,18,19,col);ellipse(-57,-53,10,11,'#f3adab');ellipse(57,-53,10,11,'#f3adab');ellipse(-39,-18,22,14,type==='bomb'?'#886a7b':'#f7a2a5a8');ellipse(39,-18,22,14,type==='bomb'?'#886a7b':'#f7a2a5a8');

if(type==='fast'){rounded(-63,-79,126,16,4,'#e84d4c');rounded(33,-84,35,13,5,'#f0be55')}if(type==='heart'){star(45,-90,15,'#f9b6ca');ellipse(38,-100,18,16,'#ec78a4');ellipse(53,-101,18,16,'#f699bd');star(-54,-90,9,'#ffe3ea')}if(type==='gold'||type==='boss'){ctx.fillStyle='#ffc637';ctx.beginPath();ctx.moveTo(-39,-98);ctx.lineTo(-43,-128);ctx.lineTo(-18,-112);ctx.lineTo(0,-136);ctx.lineTo(18,-112);ctx.lineTo(43,-128);ctx.lineTo(39,-98);ctx.closePath();ctx.fill();rounded(-42,-100,84,14,5,'#f3aa25','#fff0a4',3);star(0,-110,9,'#fff4c6')}if(type==='boss'){rounded(-79,-23,25,67,10,'#c64e5a');rounded(55,-23,25,67,10,'#c64e5a')}if(type==='bomb'){ellipse(0,-112,6,17,'#8c604e');ellipse(2,-131,11,11,'#ff9d33');star(2,-136,12,'#fff2a1')}
ctx.restore()}
function hammerDraw(){if(!hammer)return;let t=hammer.t,a=t<.12?-1.05+1.1*t/.12:.05-(t-.12)*3.2;ctx.save();ctx.translate(hammer.x+77,hammer.y-105);ctx.rotate(a);line(0,22,60,102,'#d78b6a',22);line(0,22,60,102,'#ffcf9b',11);rounded(-47,-45,92,66,21,'#f2a5bb','#ffdc6c',8);rounded(-43,-40,84,59,18,'#f7a6bc');star(0,-12,26,'#ffe66a');ellipse(-25,-31,9,6,'#fff9f0a1');star(52,84,13,'#ffc2da');ctx.restore()}
function render(){ctx.save();if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));bg();for(let i=0;i<holes.length;i++){drawHole(holes[i]);let m=active.find(m=>m.i===i);if(m)mole(m);frontHole(holes[i])}for(let p of particles){ctx.globalAlpha=clamp(p.life/.5,0,1);if(p.shape==='star')star(p.x,p.y,p.size,p.color,elapsed*4);else ellipse(p.x,p.y,p.size*.58,p.size*.58,p.color)}ctx.globalAlpha=1;for(let t of texts){ctx.globalAlpha=clamp(t.life,0,1);label(t.s,t.x,t.y,t.size*t.life**.12,t.color)}ctx.globalAlpha=1;hammerDraw();ctx.restore();if(phase==='home'){label('✦ 魔法森林探險 ✦',480,190,32,'#fff1b2','#925e3c')}}
function frame(ts){if(!last)last=ts;let dt=Math.min(.05,(ts-last)/1000);last=ts;update(dt);render();requestAnimationFrame(frame)}
